name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^MODULE_VERSION_NAME=//p' gradle.properties | tr -d '\r')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match module version v$version" >&2
            exit 1
          fi

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build, lint and test
        shell: bash
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Prepare APK artifacts
        shell: bash
        run: |
          version="$(sed -n 's/^MODULE_VERSION_NAME=//p' gradle.properties | tr -d '\r')"
          mkdir -p artifacts/debug artifacts/release
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/debug/NagramXVideoTimer-$version-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/release/NagramXVideoTimer-$version.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: artifacts/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: artifacts/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Release APK
        uses: actions/download-artifact@v5
        with:
          name: release-apk
          path: release

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"

          # Extract the Keep a Changelog section for this version.
          awk -v version="$version" '
            BEGIN {
              printing = 0
              header = "## [" version "]"
            }
            index($0, header) == 1 {
              printing = 1
              next
            }
            printing && substr($0, 1, 3) == "## " {
              exit
            }
            printing { print }
          ' CHANGELOG.md > "$notes_file"

          # Drop leading blank lines so the release body starts with content.
          awk 'NF { seen = 1 } seen { print }' "$notes_file" > "${notes_file}.trim"
          mv "${notes_file}.trim" "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi

          # Keep a compare/tag link at the bottom, derived from the CHANGELOG footer when present.
          previous="$(
            sed -n "s|^\\[${version}\\]: .*/compare/\\(v[0-9][0-9.]*[0-9]\\)\\.\\.\\..*|\\1|p" CHANGELOG.md \
              | head -n 1
          )"
          if [[ -n "$previous" ]]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GH_REPO" "$previous" "$GITHUB_REF_NAME" >> "$notes_file"
          else
            printf '\n\n**Full Changelog**: https://github.com/%s/releases/tag/%s\n' \
              "$GH_REPO" "$GITHUB_REF_NAME" >> "$notes_file"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "NagramX Video Timer $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
            gh release upload "$GITHUB_REF_NAME" release/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.apk \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "NagramX Video Timer $GITHUB_REF_NAME"
          fi
