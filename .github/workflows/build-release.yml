name: Build and Release

on:
  push:
    tags:
      - "*-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version_code="$(sed -n 's/^MODULE_VERSION_CODE=//p' gradle.properties | tr -d '\r')"
          version_name="$(sed -n 's/^MODULE_VERSION_NAME=//p' gradle.properties | tr -d '\r')"
          expected_tag="${version_code}-${version_name}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match module version $expected_tag" >&2
            exit 1
          fi

      - name: Prepare release signing material
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" || -z "${RELEASE_KEYSTORE_PASSWORD:-}" || \
                -z "${RELEASE_KEY_ALIAS:-}" || -z "${RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "Release signing secrets are required for a tag build." >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/nagramx-videotimer-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "RELEASE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build, lint and test
        shell: bash
        env:
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^MODULE_VERSION_NAME=//p' gradle.properties | tr -d '\r')"
          mkdir -p artifacts/debug
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/debug/NagramXVideoTimer-$version-debug.apk"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mkdir -p artifacts/release
            cp app/build/outputs/apk/release/app-release.apk "artifacts/release/NagramXVideoTimer-$version.apk"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: artifacts/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: artifacts/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: rm -f "$RUNNER_TEMP/nagramx-videotimer-release.jks"

  release:
    name: Publish official GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: official-release
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout release tag and main history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Release APK
        uses: actions/download-artifact@v5
        with:
          name: release-apk
          path: release

      - name: Sync official source and release tag
        shell: bash
        env:
          OFFICIAL_RELEASE_TOKEN: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          OFFICIAL_REPOSITORY: Xposed-Modules-Repo/com.shitianyaa.nagramx.videotimer
        run: |
          set -euo pipefail

          if [[ -z "${OFFICIAL_RELEASE_TOKEN:-}" ]]; then
            echo "OFFICIAL_RELEASE_TOKEN is required to publish to the official repository." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main

          release_sha="$(git rev-parse "${GITHUB_REF_NAME}^{}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$release_sha" "$main_sha"; then
            echo "Release tag $GITHUB_REF_NAME must be reachable from main." >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "$OFFICIAL_RELEASE_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git remote add official "https://github.com/$OFFICIAL_REPOSITORY.git"

          official_git() {
            git -c http.extraheader="AUTHORIZATION: Basic $auth_header" "$@"
          }

          # Normal pushes preserve official history and reject an unexpected divergence.
          official_git push official refs/remotes/origin/main:refs/heads/main

          official_tag_sha="$(official_git ls-remote --tags official "refs/tags/${GITHUB_REF_NAME}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$official_tag_sha" ]]; then
            official_tag_sha="$(official_git ls-remote --tags official "refs/tags/$GITHUB_REF_NAME" | awk 'NR == 1 { print $1 }')"
          fi

          if [[ -z "$official_tag_sha" ]]; then
            official_git push official "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          elif [[ "$official_tag_sha" != "$release_sha" ]]; then
            echo "Official tag $GITHUB_REF_NAME points to $official_tag_sha, expected $release_sha." >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          GH_REPO: Xposed-Modules-Repo/com.shitianyaa.nagramx.videotimer
        run: |
          set -euo pipefail

          version="$(sed -n 's/^MODULE_VERSION_NAME=//p' gradle.properties | tr -d '\r')"
          notes_file="$(mktemp)"

          awk -v version="$version" '
            BEGIN {
              printing = 0
              header = "## [" version "]"
            }
            index($0, header) == 1 {
              printing = 1
              next
            }
            printing && substr($0, 1, 3) == "## " {
              exit
            }
            printing { print }
          ' CHANGELOG.md > "$notes_file"

          awk 'NF { seen = 1 } seen { print }' "$notes_file" > "${notes_file}.trim"
          mv "${notes_file}.trim" "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$version" \
              --notes-file "$notes_file"
            gh release upload "$GITHUB_REF_NAME" release/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.apk \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "$version"
          fi
